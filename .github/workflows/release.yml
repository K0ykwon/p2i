name: Release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build && npm run test:unit
        working-directory: frontend
      - run: python -m pip install -c requirements-ci.txt build
      - run: python -m build
      - run: python -m venv /tmp/p2i-wheel
      - run: /tmp/p2i-wheel/bin/python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: /tmp/p2i-wheel/bin/python -m pip install -c requirements-ci.txt dist/*.whl httpx
      - run: /tmp/p2i-wheel/bin/python -I scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2i-distributions
          path: dist/*

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements-ci.txt -e '.[test]'
      - run: python -m pytest -q
      - name: Offline CLI examples
        run: |
          p2i --help
          for demo in mlp cnn transformer; do
            p2i demo "$demo" --no-serve --save "$RUNNER_TEMP/$demo.json"
          done
  browser-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements-ci.txt -e '.[test]' build
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run test:unit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python tests/browser_acceptance.py
      - run: python -m build
      - name: Install wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/p2i-wheel"
          "$RUNNER_TEMP/p2i-wheel/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/p2i-wheel/bin/python" -m pip install -c requirements-ci.txt dist/*.whl httpx
          "$RUNNER_TEMP/p2i-wheel/bin/python" -I scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-distribution
          path: |
            dist/*
            docs/*.png
            artifacts/browser/*

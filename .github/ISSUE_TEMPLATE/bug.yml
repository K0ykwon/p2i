name: Bug report
description: Report a reproducible failure
body:
  - type: textarea
    attributes:
      label: Minimal offline reproduction
      description: Include model code and example tensor shapes; omit sensitive data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and error
      description: Python, PyTorch, P2I, device, browser, and relevant traceback.
